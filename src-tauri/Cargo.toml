[package]
name = "wowbox"
version = "0.1.0"
description = "A small cross-platform World of Warcraft addon manager"
authors = ["WowBox contributors"]
edition = "2021"

[lib]
name = "wowbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs"] }
zip = { version = "2.2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd"] }
